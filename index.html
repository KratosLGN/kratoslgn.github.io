<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmisión de Canales en Vivo</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- hls.js para reproducción de streams HLS -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root {
            --bg-light: #f8f9fa;
            --text-light: #212529;
            --bg-dark: #212529;
            --text-dark: #f8f9fa;
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --channel-active: rgba(13, 110, 253, 0.2);
            --error-color: #dc3545;
        }

        body {
            transition: background-color 0.3s, color 0.3s;
            overflow: hidden;
            height: 100vh;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .light-mode {
            background-color: var(--bg-light);
            color: var(--text-light);
        }

        .dark-mode {
            background-color: var(--bg-dark);
            color: var(--text-dark);
        }

        /* Layout principal */
        .main-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 56px); /* Restar altura de la navbar */
            width: 100vw;
        }

        /* Modo vertical (predeterminado) */
        .vertical-mode {
            flex-direction: column;
        }

        .player-container-vertical {
            width: 100%;
            flex: 0 0 60vh; /* Altura proporcional */
            position: relative;
        }

        .channels-container-vertical {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        /* Modo horizontal */
        .horizontal-mode {
            flex-direction: row;
        }

        .player-container-horizontal {
            flex: 0 0 80%;
            height: 100%;
            position: relative;
        }

        .channels-container-horizontal {
            flex: 0 0 20%;
            height: 100%;
            overflow-y: auto;
            padding: 10px;
        }

        /* Estilos comunes para el reproductor */
        .video-player {
            width: 100%;
            height: 100%;
            background-color: black;
            object-fit: contain;
        }

        /* Estilos para los canales */
        .channel-btn {
            width: 80px;
            height: 80px;
            margin: 8px;
            padding: 5px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            cursor: pointer;
        }

        .light-mode .channel-btn {
            background-color: white;
            border: 2px solid #dee2e6;
        }

        .dark-mode .channel-btn {
            background-color: #343a40;
            border: 2px solid #495057;
        }

        .channel-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15);
        }

        .channel-btn.active {
            border: 3px solid var(--primary-color);
            background-color: var(--channel-active);
        }

        .channel-img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
        }

        /* Lista de canales */
        .channels-list-vertical {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .channels-list-horizontal {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Controles del reproductor */
        .player-controls {
            position: absolute;
            bottom: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 10;
        }

        .player-wrapper:hover .player-controls {
            opacity: 1;
        }

        .control-btn {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 5px 10px;
            margin: 0 2px;
            cursor: pointer;
        }

        .control-btn:hover {
            background-color: rgba(0, 0, 0, 0.7);
        }

        /* Tema toggle */
        .theme-toggle {
            cursor: pointer;
            font-size: 1.2rem;
            margin-left: 10px;
        }

        /* Mensaje de error */
        .error-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px;
            border-radius: 5px;
            text-align: center;
            z-index: 5;
            display: none;
        }

        /* Botón de reproducción manual */
        .manual-play-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: none;
        }

        /* Spinner de carga */
        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: none;
        }

        /* Versión responsive para móviles */
        @media (max-width: 768px) {
            .channel-btn {
                width: 60px;
                height: 60px;
                margin: 5px;
            }
            
            .player-container-vertical {
                flex: 0 0 50vh;
            }
        }
    </style>
</head>
<body class="light-mode">
    <!-- Barra de navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Canales en Vivo</a>
            <div class="d-flex align-items-center">
                <span id="themeToggle" class="theme-toggle text-white">
                    <i class="fas fa-moon"></i>
                </span>
            </div>
        </div>
    </nav>

    <!-- Contenido principal -->
    <div class="main-container vertical-mode" id="mainContainer">
        <!-- Reproductor de video (vertical) -->
        <div class="player-wrapper player-container-vertical" id="playerContainer">
            <video id="videoPlayer" class="video-player" controls>
                Tu navegador no soporta el elemento de video.
            </video>
            
            <!-- Elementos adicionales para manejo de errores y controles -->
            <div id="errorMessage" class="error-message"></div>
            <button id="manualPlayBtn" class="manual-play-btn btn btn-primary">
                <i class="fas fa-play"></i> Reproducir
            </button>
            <div id="loadingSpinner" class="loading-spinner text-white">
                <i class="fas fa-circle-notch fa-spin fa-3x"></i>
                <p>Cargando canal...</p>
            </div>
            
            <div class="player-controls">
                <div>
                    <button id="pipBtn" class="control-btn" title="Picture-in-Picture">
                        <i class="fas fa-expand"></i>
                    </button>
                    <button id="fullscreenBtn" class="control-btn" title="Pantalla completa">
                        <i class="fas fa-expand-arrows-alt"></i>
                    </button>
                </div>
                <button id="muteBtn" class="control-btn" title="Silenciar">
                    <i class="fas fa-volume-up"></i>
                </button>
            </div>
        </div>

        <!-- Lista de canales (vertical) -->
        <div class="channels-container-vertical">
            <h5 class="text-center mb-3">Canales Disponibles</h5>
            <div class="channels-list-vertical" id="channelsList">
                <!-- Los canales se agregarán dinámicamente con JavaScript -->
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle con Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Configuración de canales con IDs únicos y URLs actualizadas
            const channels = [
                {
                    id: 1,
                    name: 'L1 MAX',
                    logo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/L1MAX-LOGO.svg/2560px-L1MAX-LOGO.svg.png',
                    url: 'https://cdnback5.win.cdn.moderntv.eu:7909/win/stream/Liga_1_max/40-hls/live-media.m3u8?_cdn_attrs=account%3Dwin%2Cresource%3DLiga_1_max_stream_vh&_cdn_session=1919674677&_cdn_token=72c369807d9fcbc9bbf00fe046bb695c20a6ef5d',
                    isIframe: false
                },
                { 
                    id: 2, 
                    name: "ESPN", 
                    logo: "https://upload.wikimedia.org/wikipedia/commons/6/60/ESPN_logos.png", 
                    url: "https://bantel-cdn1.iptvperu.tv:1935/btnscrtn/espn-mux/playlist.m3u8",
                    isIframe: false
                },
                { 
                    id: 3, 
                    name: 'ESPN 2', 
                    logo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/bf/ESPN2_logo.svg/1280px-ESPN2_logo.svg.png', 
                    url: 'https://bantel-cdn1.iptvperu.tv:1935/btnscrtn/espn2-mux/playlist.m3u8',
                    isIframe: false
                },
                { 
                    id: 4, 
                    name: 'ESPN 3', 
                    logo: 'https://upload.wikimedia.org/wikipedia/commons/5/51/ESPN3_Logo.png', 
                    url: 'https://bantel-cdn1.iptvperu.tv:1935/btnscrtn/espn3-mux/playlist.m3u8',
                    isIframe: false
                },
                { 
                    id: 5, 
                    name: 'ESPN 4', 
                    logo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/78/ESPN_4_logo.svg/1200px-ESPN_4_logo.svg.png', 
                    url: 'https://bantel-cdn1.iptvperu.tv:1935/btnscrtn/espn4-mux/playlist.m3u8',
                    isIframe: false
                },
                { 
                    id: 6, 
                    name: 'ESPN 5', 
                    logo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/ESPN_5_logo.svg/2560px-ESPN_5_logo.svg.png', 
                    url: 'https://bantel-cdn1.iptvperu.tv:1935/btnscrtn/espn5-mux/playlist.m3u8',
                    isIframe: false
                },
                { 
                    id: 7, 
                    name: 'ESPN 6', 
                    logo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/ESPN_6_logo.svg/1200px-ESPN_6_logo.svg.png', 
                    url: 'https://bantel-cdn1.iptvperu.tv:1935/btnscrtn/espn6-mux/playlist.m3u8',
                    isIframe: false
                },
                { 
                    id: 8, 
                    name: 'ESPN 7', 
                    logo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/7f/ESPN_7_logo.svg/2560px-ESPN_7_logo.svg.png', 
                    url: 'https://bantel-cdn1.iptvperu.tv:1935/btnscrtn/espn7-mux/playlist.m3u8',
                    isIframe: false
                }
            ];

            // Elementos del DOM
            const videoPlayer = document.getElementById('videoPlayer');
            const channelsList = document.getElementById('channelsList');
            const themeToggle = document.getElementById('themeToggle');
            const fullscreenBtn = document.getElementById('fullscreenBtn');
            const pipBtn = document.getElementById('pipBtn');
            const muteBtn = document.getElementById('muteBtn');
            const mainContainer = document.getElementById('mainContainer');
            const playerContainer = document.getElementById('playerContainer');
            const errorMessage = document.getElementById('errorMessage');
            const manualPlayBtn = document.getElementById('manualPlayBtn');
            const loadingSpinner = document.getElementById('loadingSpinner');

            let currentChannel = null;
            let isHorizontal = false;
            let hls = null;

            // Función mejorada para cargar y reproducir un stream HLS
            function playHlsStream(url, channelName) {
                showLoading(true);
                hideError();
                
                // Limpiar el reproductor primero
                videoPlayer.src = '';
                
                // Intentar con HTTPS si HTTP falla (y viceversa)
                const originalUrl = url;
                if (url.startsWith('http://') && !url.includes('localhost')) {
                    url = url.replace('http://', 'https://');
                }
                
                if (hls) {
                    hls.destroy();
                }
                
                // Mostrar mensaje de carga
                videoPlayer.poster = '';
                videoPlayer.controls = false;

                if (Hls.isSupported()) {
                    hls = new Hls({
                        maxMaxBufferLength: 30,
                        maxBufferSize: 6000000,
                        maxBufferLength: 30,
                        enableWorker: true,
                        lowLatencyMode: false,
                        backBufferLength: 30
                    });
                    
                    hls.loadSource(url);
                    hls.attachMedia(videoPlayer);
                    
                    hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        console.log(`Manifiesto cargado para ${channelName}`);
                        videoPlayer.play().catch(e => {
                            console.error("Error de autoplay:", e);
                            showManualPlayButton();
                        });
                    });
                    
                    hls.on(Hls.Events.ERROR, function(event, data) {
                        console.error("Error HLS:", data);
                        if (data.fatal) {
                            switch(data.type) {
                                case Hls.ErrorTypes.NETWORK_ERROR:
                                    console.log("Intentando con HTTP fallback...");
                                    // Intentar con HTTP si HTTPS falla
                                    if (url.startsWith('https://') && originalUrl.startsWith('http://')) {
                                        showError("Intentando conexión alternativa...");
                                        setTimeout(() => {
                                            playHlsStream(originalUrl, channelName);
                                        }, 1000);
                                    } else {
                                        showError("Error de red. Intente más tarde.");
                                    }
                                    break;
                                case Hls.ErrorTypes.MEDIA_ERROR:
                                    hls.recoverMediaError();
                                    break;
                                default:
                                    showError("No se puede reproducir este canal");
                                    break;
                            }
                        }
                    });
                    
                    hls.on(Hls.Events.DESTROYING, function() {
                        console.log("Destruyendo instancia HLS anterior");
                    });
                } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                    // Para Safari
                    videoPlayer.src = url;
                    videoPlayer.addEventListener('loadedmetadata', function() {
                        videoPlayer.play().catch(e => {
                            console.error("Error al reproducir:", e);
                            showManualPlayButton();
                        });
                    });
                    
                    videoPlayer.addEventListener('error', function() {
                        showError("Error al cargar el canal");
                    });
                } else {
                    showError("Navegador no compatible con este stream");
                }
                
                // Manejar eventos de error nativos del video
                videoPlayer.addEventListener('error', function() {
                    if (videoPlayer.error) {
                        console.error("Error de video:", videoPlayer.error);
                        showError("Error al reproducir el video");
                    }
                });
                
                // Ocultar spinner cuando el video comienza a reproducirse
                videoPlayer.addEventListener('playing', function() {
                    showLoading(false);
                });
            }

            function showLoading(show) {
                if (show) {
                    loadingSpinner.style.display = 'block';
                } else {
                    loadingSpinner.style.display = 'none';
                }
            }

            function showError(message) {
                showLoading(false);
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                videoPlayer.style.display = 'none';
            }

            function hideError() {
                errorMessage.style.display = 'none';
                videoPlayer.style.display = 'block';
            }

            function showManualPlayButton() {
                manualPlayBtn.style.display = 'block';
                manualPlayBtn.onclick = function() {
                    videoPlayer.play()
                        .then(() => {
                            manualPlayBtn.style.display = 'none';
                        })
                        .catch(e => {
                            console.error("Error al reproducir manualmente:", e);
                            showError("No se pudo reproducir el canal");
                        });
                };
            }

            // Función para detectar orientación y ajustar el layout
            function checkOrientation() {
                isHorizontal = window.innerWidth > window.innerHeight;
                
                if (isHorizontal) {
                    mainContainer.classList.remove('vertical-mode');
                    mainContainer.classList.add('horizontal-mode');
                    
                    playerContainer.classList.remove('player-container-vertical');
                    playerContainer.classList.add('player-container-horizontal');
                    
                    channelsList.classList.remove('channels-list-vertical');
                    channelsList.classList.add('channels-list-horizontal');
                } else {
                    mainContainer.classList.remove('horizontal-mode');
                    mainContainer.classList.add('vertical-mode');
                    
                    playerContainer.classList.remove('player-container-horizontal');
                    playerContainer.classList.add('player-container-vertical');
                    
                    channelsList.classList.remove('channels-list-horizontal');
                    channelsList.classList.add('channels-list-vertical');
                }
            }

            // Cargar canales en la lista
            function loadChannels() {
                channelsList.innerHTML = '';
                channels.forEach(channel => {
                    const channelElement = document.createElement('button');
                    channelElement.className = 'channel-btn';
                    channelElement.title = channel.name;
                    channelElement.innerHTML = `<img src="${channel.logo}" alt="${channel.name}" class="channel-img">`;
                    channelElement.addEventListener('click', () => playChannel(channel));
                    
                    channelsList.appendChild(channelElement);
                });
            }

            // Reproducir canal seleccionado
            function playChannel(channel) {
                // Quitar clase active de todos los botones
                document.querySelectorAll('.channel-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                
                // Marcar el botón actual como activo
                const activeBtn = Array.from(document.querySelectorAll('.channel-btn'))[channels.findIndex(c => c.id === channel.id)];
                if (activeBtn) activeBtn.classList.add('active');
                
                // Cambiar el video
                playHlsStream(channel.url, channel.name);
                currentChannel = channel;
                
                // Actualizar título de la página
                document.title = `${channel.name} - Canales en Vivo`;
            }

            // Cambiar entre modo oscuro y claro
            themeToggle.addEventListener('click', function() {
                document.body.classList.toggle('light-mode');
                document.body.classList.toggle('dark-mode');
                
                if (document.body.classList.contains('dark-mode')) {
                    themeToggle.innerHTML = '<i class="fas fa-sun"></i>';
                } else {
                    themeToggle.innerHTML = '<i class="fas fa-moon"></i>';
                }
            });

            // Control de pantalla completa
            fullscreenBtn.addEventListener('click', function() {
                if (!document.fullscreenElement) {
                    playerContainer.requestFullscreen().catch(err => {
                        alert(`Error al intentar pantalla completa: ${err.message}`);
                    });
                } else {
                    document.exitFullscreen();
                }
            });

            // Control de Picture-in-Picture
            pipBtn.addEventListener('click', function() {
                if (document.pictureInPictureElement) {
                    document.exitPictureInPicture().catch(err => {
                        console.error(`Error al salir de PiP: ${err}`);
                    });
                } else if (document.pictureInPictureEnabled) {
                    videoPlayer.requestPictureInPicture().catch(err => {
                        console.error(`Error al entrar en PiP: ${err}`);
                    });
                }
            });

            // Control de silencio
            muteBtn.addEventListener('click', function() {
                videoPlayer.muted = !videoPlayer.muted;
                muteBtn.innerHTML = videoPlayer.muted ? 
                    '<i class="fas fa-volume-mute"></i>' : 
                    '<i class="fas fa-volume-up"></i>';
            });

            // Inicializar
            loadChannels();
            if (channels.length > 0) {
                playChannel(channels[0]);
            }

            // Detectar cambios de orientación y tamaño
            window.addEventListener('resize', checkOrientation);
            window.addEventListener('orientationchange', checkOrientation);
            
            // Comprobar orientación inicial
            checkOrientation();
            
            // Manejar cambios en la conexión
            window.addEventListener('online', () => {
                if (currentChannel && videoPlayer.paused) {
                    playChannel(currentChannel);
                }
            });
            
            // Mostrar controles al mover el mouse en el reproductor
            playerContainer.addEventListener('mousemove', function() {
                const controls = document.querySelector('.player-controls');
                controls.style.opacity = '1';
                clearTimeout(window.controlsTimeout);
                window.controlsTimeout = setTimeout(() => {
                    controls.style.opacity = '0';
                }, 3000);
            });
        });
    </script>
</body>
</html>
