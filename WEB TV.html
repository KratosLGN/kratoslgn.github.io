<!DOCTYPE html>

<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="apple-mobile-web-app-capable" content="yes">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <meta name="apple-mobile-web-app-title" content="Fsociety TV">

  <link rel="apple-touch-icon" href="https://fsociety.lat/images/logo.png">

  <link rel="icon" type="image/jpg" href="https://fsociety.lat/images/logo.png"/>

  <title>Fsociety TV | Hackeando la señal</title>

  <!-- Bootstrap 5.3 CSS -->

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome 6 -->

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Video.js CSS -->

  <link href="https://vjs.zencdn.net/8.6.1/video-js.css" rel="stylesheet">

  <style>

    :root {

      --bg-dark: #0c0c0c;

      --accent-green: #00ff41;

      --accent-dark: #003b1f;

      --text-primary: #e0e0e0;

      --text-secondary: #aaaaaa;

      --glitch-time: 0.8s;

    }

    body {

      font-family: 'Consolas', 'Courier New', monospace;

      background-color: var(--bg-dark);

      color: var(--text-primary);

      overflow-x: hidden;

      overflow-y: auto;

      scrollbar-width: none;

      line-height: 1.6;

    }

    .scanlines {

      position: fixed; top:0; left:0;

      width:100%; height:100%;

      background: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%);

      background-size:100% 2px;

      pointer-events:none; z-index:1000; opacity:0.6;

    }



    /* Loading Screen */

    .loading-screen {

      position: fixed;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      background-color: var(--bg-dark);

      z-index: 9999;

      display: flex;

      flex-direction: column;

      justify-content: center;

      align-items: center;

    }



    .matrix-rain {

      position: absolute;

      top: 0;

      left: 0;

      width: 100%;

      height: 100%;

      opacity: 0.3;

      z-index: 1;

    }



    .loading-content {

      position: relative;

      z-index: 2;

      text-align: center;

    }



    .loading-spinner {

      color: var(--accent-green);

      font-size: 3rem;

    }



    .loading-text {

      color: var(--accent-green);

      font-size: 1.5rem;

      margin-top: 1rem;

      text-align: center;

    }



    .header { border-bottom:1px solid var(--accent-green); padding:1rem 0; position:relative; z-index:100; }

    .logo { color:var(--accent-green); font-weight:bold; font-size:1.8rem; text-decoration:none; transition:0.3s; position:relative; }

    .logo:hover { text-shadow:0 0 10px var(--accent-green); }

    .slogan { color:var(--text-secondary); font-size:0.9rem; margin-left:1rem; }

    .main-container { display:flex; flex-direction:row; min-height:calc(100vh - 120px); }

    @media (max-width:768px){ .main-container{ flex-direction:column } }

    .player-section { flex:60%; padding:1rem; }

    .player-container { width:100%; padding-bottom:56.25%; position:relative; background:#000; border:1px solid var(--accent-dark); }

    #iptv-player { position:absolute; top:0; left:0; width:100%; height:100%; }

    .vjs-theme-fsociety { --vjs-theme-fsociety--primary:var(--accent-green); --vjs-theme-fsociety--secondary:var(--bg-dark); }

    .vjs-theme-fsociety .vjs-big-play-button { background:rgba(0,255,65,0.2); border-color:var(--accent-green); }

    .vjs-theme-fsociety .vjs-control-bar { background:rgba(12,12,12,0.8); color:var(--accent-green); }

    .vjs-theme-fsociety .vjs-play-progress { background-color:var(--accent-green); }

    .channel-section { flex:40%; padding:1rem; border-left:1px solid var(--accent-dark); overflow:hidden; }

    @media (max-width:768px){ .channel-section{ border-left:none; border-top:1px solid var(--accent-dark) } }

    .channel-search { position:relative; margin-bottom:1rem; }

    .channel-search input {

  width: 100%;

  padding: .5rem 1rem;

  background: #111;

  border: 1px solid var(--accent-dark);

  color: var(--accent-green);

  border-radius: 16px; /* Bordes redondeados similares a iOS */

  box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1); /* Agregar sombra sutil en el input */

}

    .channel-search i { position:absolute; right:15px; top:10px; color:var(--accent-green); }

    .channel-list { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:1rem; max-height:calc(100vh - 250px); overflow-y:auto; padding-right:.5rem; justify-items: center; }

    .channel-item {

  background: #111;

  border: 1px solid #d3d3d3; /* Borde gris claro */

  padding: 1rem;

  text-align: center;

  cursor: pointer;

  transition: 0.3s;

  position: relative;

  border-radius: 16px; 

  width: 120px;

  height: 120px;

  display: flex;

  justify-content: center;

  align-items: center;

  box-shadow: 0 3px 6px rgba(0, 0, 0, 0.1);

} /* Sombra sutil para imitar el estilo de iOS */

}



.channel-item:hover .channel-logo {

  filter: grayscale(0%) brightness(1.2);

}



.channel-item.active {

  background: rgba(0, 255, 65, 0.1);

  border-color: var(--accent-green);

}

   .channel-logo {

  width: 100%;

  height: 60px;

  object-fit: contain;

  margin-bottom: .5rem;

  filter: grayscale(30%);

  transition: 0.3s;

}

    .channel-item:hover .channel-logo { filter:grayscale(0%) brightness(1.2); }

    .channel-name { display:none;font-size:0.8rem; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .glitch-effect { position:relative; }

    .glitch-effect:hover::before,

    .glitch-effect:hover::after { content:attr(data-text); position:absolute; top:0; left:0; width:100%; height:100%; opacity:0.8; }

    .glitch-effect:hover::before { color:#0ff; z-index:-1; animation:glitch var(--glitch-time) infinite; }

    .glitch-effect:hover::after  { color:#f0f; z-index:-2; animation:glitch var(--glitch-time) infinite reverse; }

    @keyframes glitch { 0%{transform:translate(0)}20%{transform:translate(-2px,2px)}40%{transform:translate(-2px,-2px)}60%{transform:translate(2px,2px)}80%{transform:translate(2px,-2px)}100%{transform:translate(0)} }

    .footer { border-top:1px solid var(--accent-dark); padding:1rem 0; color:var(--text-secondary); font-size:0.8rem; }

    .status-indicator { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; }

    .status-online { background:var(--accent-green); box-shadow:0 0 5px var(--accent-green); }

    .status-offline { background:#ff0000; }

    .modal-content, .modal-header, .modal-footer { background:var(--bg-dark); border-color:var(--accent-dark); color:var(--text-primary); }

    .btn-fsociety { background:transparent; border:1px solid var(--accent-green); color:var(--accent-green); transition:0.3s; }

    .btn-fsociety:hover { background:var(--accent-green); color:var(--bg-dark); box-shadow:0 0 10px var(--accent-green); }

  </style>

</head>

<body>

  <!-- Loading Screen -->

  <div class="loading-screen" id="loadingScreen">

    <!-- MATRIX ESP Animation -->

    <canvas id="matrixRain" class="matrix-rain"></canvas>

    <div class="loading-content">

      <div class="loading-spinner">

        <i class="fas fa-circle-notch fa-spin"></i>

      </div>

      <div class="loading-text">Cargando Fsociety TV...</div>

    </div>

  </div>



  <header class="header">

    <div class="container">

      <div class="row align-items-center">

        <div class="col-md-6">

          <a href="#" class="logo glitch-effect" data-text="Fsociety TV">Fsociety TV</a>

          <span class="slogan d-none d-md-inline">hackeando la señal, liberando tu mente</span>

        </div>

        <div class="col-md-6 text-md-end">

          <span id="connectionStatus">

            <span class="status-indicator status-online"></span><span>Online</span>

          </span>

        </div>

      </div>

    </div>

  </header>



  <main class="main-container">

    <section class="player-section">

      <div class="player-container">

        <video id="iptv-player" class="video-js vjs-theme-fsociety" controls preload="auto">

          <p class="vjs-no-js">Para ver este video habilita JavaScript y actualiza tu navegador.</p>

        </video>

      </div>

    </section>

    <section class="channel-section">

      <div class="channel-search">

        <input type="text" id="channelSearch" placeholder="Buscar canal">

        <i class="fas fa-search"></i>

      </div>

      <div class="channel-list" id="channelList"></div>

    </section>

  </main>



  <footer class="footer">

    <div class="container">

      <div class="row">

        <div class="col-md-6"><p>Fsociety TV &copy; <span id="currentYear"></span></p></div>

        <div class="col-md-6 text-md-end">

          <button class="btn btn-sm btn-fsociety me-2" data-bs-toggle="modal" data-bs-target="#contactModal"><i class="fas fa-envelope me-1"></i>Contacto</button>

          <a href="https://paypal.me/fsociety" class="btn btn-sm btn-fsociety" target="_blank"><i class="fas fa-donate me-1"></i>Donaciones</a>

        </div>

      </div>

    </div>

  </footer>



  <div class="modal fade" id="contactModal" tabindex="-1">

    <div class="modal-dialog"><div class="modal-content">

      <div class="modal-header"><h5 class="modal-title">Contacto Fsociety</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>

      <div class="modal-body">

        <form id="contactForm">

          <div class="mb-3"><label class="form-label">Nombre</label><input type="text" class="form-control bg-dark text-light" required></div>

          <div class="mb-3"><label class="form-label">Email</label><input type="email" class="form-control bg-dark text-light" required></div>

          <div class="mb-3"><label class="form-label">Mensaje</label><textarea class="form-control bg-dark text-light" rows="3" required></textarea></div>

        </form>

      </div>

      <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button><button form="contactForm" class="btn btn-fsociety">Enviar</button></div>

    </div></div>

  </div>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script src="https://vjs.zencdn.net/8.6.1/video.min.js"></script>

  <script>

    document.addEventListener('DOMContentLoaded', () => {

      document.getElementById('currentYear').textContent = new Date().getFullYear();

      initPlayer();

      loadChannels();

      simulateConnection();

      initMatrixRain();  // Start MATRIX ESP animation

      simulateLoading();  // Simulate loading process with status updates

    });



    function initPlayer() {

      window.player = videojs('iptv-player', { fluid:true, responsive:true });

    }



    const channels = [

  { 

    id: 1, 

    name: 'L1 MAX', 

    logo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/38/L1MAX-LOGO.svg/2560px-L1MAX-LOGO.svg.png', 

    url: 'https://cdnback5.win.cdn.moderntv.eu:7909/win/stream/Liga_1_max/40-hls/live-media.m3u8?_cdn_attrs=account%3Dwin%2Cresource%3DLiga_1_max_stream_vh&_cdn_session=1919674677&_cdn_token=72c369807d9fcbc9bbf00fe046bb695c20a6ef5d'

  },

  { 

    id: 2, 

    name: 'ESPN', 

    logo: 'https://upload.wikimedia.org/wikipedia/commons/6/60/ESPN_logos.png', 

    url: 'http://bantel-cdn1.iptvperu.tv:1935/btnscrtn/espn-mux/playlist.m3u8'

  },

  { 

    id: 3, 

    name: 'ESPN 2', 

    logo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/bf/ESPN2_logo.svg/1280px-ESPN2_logo.svg.png', 

    url: 'http://bantel-cdn1.iptvperu.tv:1935/btnscrtn/espn2-mux/playlist.m3u8'

  },

  { 

    id: 4, 

    name: 'ESPN 3', 

    logo: 'https://upload.wikimedia.org/wikipedia/commons/5/51/ESPN3_Logo.png', 

    url: 'http://bantel-cdn1.iptvperu.tv:1935/btnscrtn/espn3-mux/playlist.m3u8'

  },

  { 

    id: 5, 

    name: 'ESPN 4', 

    logo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/78/ESPN_4_logo.svg/1200px-ESPN_4_logo.svg.png', 

    url: 'http://bantel-cdn1.iptvperu.tv:1935/btnscrtn/espn4-mux/playlist.m3u8'

  },

  { 

    id: 6, 

    name: 'ESPN 5', 

    logo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c7/ESPN_5_logo.svg/2560px-ESPN_5_logo.svg.png', 

    url: 'http://bantel-cdn1.iptvperu.tv:1935/btnscrtn/espn5-mux/playlist.m3u8'

  },

  { 

    id: 7, 

    name: 'ESPN 6', 

    logo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/3/33/ESPN_6_logo.svg/1200px-ESPN_6_logo.svg.png', 

    url: 'http://bantel-cdn1.iptvperu.tv:1935/btnscrtn/espn6-mux/playlist.m3u8'

  },

  { 

    id: 8, 

    name: 'ESPN 7', 

    logo: 'https://upload.wikimedia.org/wikipedia/commons/thumb/7/7f/ESPN_7_logo.svg/2560px-ESPN_7_logo.svg.png', 

    url: 'http://bantel-cdn1.iptvperu.tv:1935/btnscrtn/espn7-mux/playlist.m3u8'

  },

  { 

    id: 9, 

    name: 'DSports', 

    logo: 'https://upload.wikimedia.org/wikipedia/commons/5/5a/DSports.png', 

    url: 'https://streamtpglobal.com/global2.php?stream=dsports'

  },

];





    function loadChannels() {

      const list = document.getElementById('channelList');

      channels.forEach((ch,i) => {

        const div = document.createElement('div');

        div.className = 'channel-item';

        div.innerHTML = `<img src="${ch.logo}" class="channel-logo"><div class="channel-name">${ch.name}</div>`;

        div.onclick = () => playChannel(ch, div);

        list.appendChild(div);

      });

      document.getElementById('channelSearch').oninput = e => {

        const term = e.target.value.toLowerCase();

        document.querySelectorAll('.channel-item').forEach((ci, i) => {

          ci.style.display = channels[i].name.toLowerCase().includes(term)?'grid':'none';

        });

      };

    }



    function playChannel(ch, el) {

      document.querySelectorAll('.channel-item').forEach(x=>x.classList.remove('active'));

      el.classList.add('active');

      player.src({ src: ch.url, type: 'application/x-mpegURL' });

      player.play();

    }



    function simulateConnection() {

      const cs = document.getElementById('connectionStatus');

      setInterval(() => {

        const dot = cs.querySelector('.status-indicator');

        const txt = cs.querySelector('span:last-child');

        if (Math.random()>0.9) {

          dot.className='status-indicator status-offline'; txt.textContent='Offline';

        } else {

          dot.className='status-indicator status-online'; txt.textContent='Online';

        }

      }, 8000);

    }



    document.getElementById('contactForm').addEventListener('submit', e => {

      e.preventDefault();

      alert('Mensaje enviado (simulado). ¡Gracias!');

      bootstrap.Modal.getInstance(document.getElementById('contactModal')).hide();

      e.target.reset();

    });



    // MATRIX ESP Animation

    function initMatrixRain() {

      const canvas = document.getElementById('matrixRain');

      const ctx = canvas.getContext('2d');



      canvas.width = window.innerWidth;

      canvas.height = window.innerHeight;



      const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';

      const fontSize = 16;

      const columns = canvas.width / fontSize;



      const rainDrops = [];



      for (let x = 0; x < columns; x++) {

        rainDrops[x] = 1;

      }



      const draw = () => {

        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';

        ctx.fillRect(0, 0, canvas.width, canvas.height);



        ctx.fillStyle = '#00ff41';

        ctx.font = fontSize + 'px monospace';



        for (let i = 0; i < rainDrops.length; i++) {

          const text = katakana.charAt(Math.floor(Math.random() * katakana.length));

          ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);



          if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {

            rainDrops[i] = 0;

          }

          rainDrops[i]++;

        }

      };



      const interval = setInterval(draw, 50);



      window.addEventListener('resize', () => {

        canvas.width = window.innerWidth;

        canvas.height = window.innerHeight;

      });

    }



    // Simulate loading process with status updates

    function simulateLoading() {

      const statusMessages = [

        "Cargando recursos...",

        "Inicializando reproductor...",

        "Conectando a servidores...",

        "Cargando lista de canales...",

        "Precargando streams...",

        "Listo!"

      ];



      const loadingStatus = document.querySelector('.loading-text');

      let currentStatus = 0;



      const statusInterval = setInterval(() => {

        loadingStatus.textContent = statusMessages[currentStatus];

        currentStatus++;



        if (currentStatus >= statusMessages.length) {

          clearInterval(statusInterval);



          // Hide loading screen after a short delay

          setTimeout(() => {

            document.querySelector('.loading-screen').style.opacity = '0';

            setTimeout(() => {

              document.querySelector('.loading-screen').style.display = 'none';

            }, 500);

          }, 500);

        }

      }, 800);

    }

  </script>

</body>

</html>
